# gpu-device-plugin-sa.yaml
# serviceAccount: gpu-device-plugin-sa

apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-device-plugin-sa
  namespace: kube-system

---
# gpu-device-plugin-role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-device-plugin-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "update", "patch"]

---
# gpu-device-plugin-rolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-device-plugin-binding
subjects:
- kind: ServiceAccount
  name: gpu-device-plugin-sa
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: gpu-device-plugin-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kata-xpu-dp-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: kata-xpu-dp-ds
  template:
    metadata:
      labels:
        name: kata-xpu-dp-ds
    spec:
      serviceAccount: gpu-device-plugin-sa
      priorityClassName: system-node-critical
      tolerations:
      # Allow this pod to be rescheduled while the node is in "critical add-ons only" mode.
      # This, along with the annotation above marks this pod as a critical add-on.
      - key: CriticalAddonsOnly
        operator: Exists
      containers:
      - name: kata-xpu-dp-ctr
        image: <Repo>/kata-xpu-device-plugin:v1.3.25
        args:
          - --device-list-strategy=$(DEVICE_LIST_STRATEGY)
        env:
          - name: DEVICE_LIST_STRATEGY
            value: "cdi-cri"
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: device-plugin
            mountPath: /var/lib/kubelet/device-plugins
          - name: pod-resources
            mountPath: /var/lib/kubelet/pod-resources
          - name: vfio
            mountPath: /dev/vfio
          - name: container-device-interface
            mountPath: /var/run/cdi
      imagePullSecrets:
      - name: regcred
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: pod-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
        - name: vfio
          hostPath:
            path: /dev/vfio
        - name: container-device-interface
          hostPath:
            path: /var/run/cdi
